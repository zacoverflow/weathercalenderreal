name: Update weather feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), at :17 to avoid the busy top of the hour
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches: [main]
    paths:
      - weather_feed.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build weather.ics
        run: python weather_feed.py

      - name: Commit if changed
        run: |
          git config user.name "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add docs/weather.ics
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update weather feed"
            git push
          fi
